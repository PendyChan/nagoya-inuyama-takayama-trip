<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#f7f2e9"/>
  <rect width="1080" height="330" fill="#13283b"/>
  <circle cx="930" cy="90" r="190" fill="#b84b3f" opacity=".85"/>
  <circle cx="1000" cy="260" r="120" fill="#d68a50" opacity=".45"/>
  <text x="72" y="72" fill="#f0c98c" font-family="Arial,sans-serif" font-size="28" letter-spacing="5">2026 秋・中部地方</text>
  <text x="72" y="155" fill="#fffaf0" font-family="Arial,sans-serif" font-size="68" font-weight="700">名古屋・犬山・高山</text>
  <text x="75" y="210" fill="#fffaf0" font-family="Arial,sans-serif" font-size="30">媽媽的五日旅行手帳　｜　10/30 — 11/03</text>
  <text x="75" y="275" fill="#b9c8cf" font-family="Arial,sans-serif" font-size="25">城市、國寶古城與飛驒山城</text>
  <rect x="65" y="365" width="950" height="150" rx="22" fill="#fffaf0" stroke="#e4d8c8" stroke-width="3"/>
  <text x="95" y="410" fill="#b84b3f" font-family="Arial,sans-serif" font-size="24" font-weight="700">航班</text>
  <text x="95" y="462" fill="#13283b" font-family="Arial,sans-serif" font-size="30" font-weight="700">10/30　台北 08:45 → 名古屋 12:25</text>
  <text x="95" y="500" fill="#56636b" font-family="Arial,sans-serif" font-size="24">IT206　｜　飛行約 2 小時 40 分</text>
  <text x="585" y="462" fill="#13283b" font-family="Arial,sans-serif" font-size="30" font-weight="700">11/03　名古屋 13:15 → 台北 15:50</text>
  <text x="585" y="500" fill="#56636b" font-family="Arial,sans-serif" font-size="24">IT207　｜　飛行約 3 小時 35 分</text>
  <g font-family="Arial,sans-serif">
    <rect x="65" y="570" width="950" height="250" rx="24" fill="#fffaf0"/>
    <rect x="65" y="570" width="12" height="250" rx="6" fill="#d68a50"/>
    <text x="105" y="625" fill="#b84b3f" font-size="25" font-weight="700">10/30　FRI　名古屋</text>
    <text x="105" y="680" fill="#13283b" font-size="32" font-weight="700">中部機場 → 名古屋站 → 則武之森</text>
    <text x="105" y="728" fill="#56636b" font-size="24">名鐵 μSKY 約 28 分　｜　晚餐：鰻魚飯、味噌豬排</text>
    <text x="105" y="775" fill="#56636b" font-size="22">住宿：名古屋站附近</text>
    <rect x="65" y="850" width="950" height="390" rx="24" fill="#fffaf0"/>
    <rect x="65" y="850" width="12" height="390" rx="6" fill="#b84b3f"/>
    <text x="105" y="905" fill="#b84b3f" font-size="25" font-weight="700">10/31　SAT　犬山一日</text>
    <text x="105" y="960" fill="#13283b" font-size="32" font-weight="700">名鐵名古屋 → 犬山（約 25–35 分）</text>
    <text x="105" y="1010" fill="#56636b" font-size="24">犬山城下町・三光稻荷神社・針綱神社</text>
    <text x="105" y="1055" fill="#56636b" font-size="24">國寶犬山城・城下町午餐與甜點</text>
    <text x="105" y="1100" fill="#56636b" font-size="24">有樂苑與如庵・木曾川河畔夕景</text>
    <text x="105" y="1175" fill="#13283b" font-size="25" font-weight="700">17:25　犬山遊園 → 名古屋，回站吃晚餐</text>
    <rect x="65" y="1270" width="950" height="285" rx="24" fill="#fffaf0"/>
    <rect x="65" y="1270" width="12" height="285" rx="6" fill="#557b87"/>
    <text x="105" y="1325" fill="#b84b3f" font-size="25" font-weight="700">11/01　SUN　高山</text>
    <text x="105" y="1380" fill="#13283b" font-size="32" font-weight="700">JR 特急飛驒　名古屋 → 高山（約 2 小時 30 分）</text>
    <text x="105" y="1430" fill="#56636b" font-size="24">高山陣屋・中橋・三町古街・飛驒牛</text>
    <text x="105" y="1475" fill="#56636b" font-size="24">住宿：高山站步行 5–10 分鐘</text>
    <rect x="65" y="1585" width="950" height="235" rx="24" fill="#fffaf0"/>
    <rect x="65" y="1585" width="12" height="235" rx="6" fill="#d68a50"/>
    <text x="105" y="1640" fill="#b84b3f" font-size="25" font-weight="700">11/02–11/03　高山 → 名古屋 → 回台</text>
    <text x="105" y="1695" fill="#13283b" font-size="30" font-weight="700">朝市・櫻山八幡宮 → JR 飛驒回名古屋</text>
    <text x="105" y="1745" fill="#56636b" font-size="24">11/02 晚上逛榮町／Oasis 21</text>
    <text x="105" y="1790" fill="#56636b" font-size="24">11/03 09:20 左右出發 → 10:00 抵達中部機場</text>
  </g>
  <text x="72" y="1875" fill="#8a7967" font-family="Arial,sans-serif" font-size="21">交通時間為規劃值；出發前請以 JR 東海、名鐵與航空公司公告為準。</text>
</svg>
